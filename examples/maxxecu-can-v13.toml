# MaxxECU "default CAN protocol" 1.3 — adds oil/fuel pressure, oil temperature,
# brake/clutch switches and G. Oil/fuel additions need firmware 1.135 or later.
ecu_protocol = "maxxecu_can_v13"
connection_type = "tcp"
tcp_host = "127.0.0.1"
tcp_port = 29536
can_base_id = 0x520
mqtt_host = "localhost"
mqtt_port = 1883
mqtt_base_topic = "/g86/car-1/ecu/"
