# Speeduino primary serial 'A' output over USB.
# Publishes the canonical /telemetry envelope plus the legacy scalar topics
# (RPM, MAP, CLT …) and drives the full terminal dashboard.
# "auto" finds the board by its signature; set the device path to pin it.
ecu_protocol = "speeduino"
connection_type = "serial"
port_name = "auto"
baud_rate = 115200
refresh_rate_ms = 20
mqtt_host = "localhost"
mqtt_port = 1883
mqtt_base_topic = "/g86/car-1/ecu/"
