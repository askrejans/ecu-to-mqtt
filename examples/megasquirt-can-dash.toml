# MegaSquirt dash broadcasting, 11-bit IDs, normally 500 kbit/s.
# Enable "dash broadcasting" in TunerStudio; base 1512 = 0x5E8.
#   python3 scripts/can_gateway.py --interface socketcan --channel can0 --bitrate 500000
ecu_protocol = "megasquirt_can_dash"
connection_type = "tcp"
tcp_host = "127.0.0.1"
tcp_port = 29536
can_base_id = 1512
mqtt_host = "localhost"
mqtt_port = 1883
mqtt_base_topic = "/g86/car-1/ecu/"
