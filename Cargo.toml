[package]
name = "ecu-to-mqtt"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
authors = ["askrejans"]
description = "Read-only ECU telemetry gateway: Speeduino, MegaSquirt and CAN ECUs to MQTT, HTTP and a web dashboard"
license = "GPL-3.0-only"
repository = "https://github.com/askrejans/ecu-to-mqtt"
readme = "README.md"
keywords = ["speeduino", "megasquirt", "ecu", "mqtt", "telemetry"]
categories = ["command-line-utilities", "embedded", "network-programming"]

[[bin]]
name = "ecu-to-mqtt"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = "0.7.20"
tokio-serial = "5.5.0"
futures-util = "0.3.34"

# Configuration
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"

# MQTT (pure Rust, rustls)
rumqttc = "0.25.1"

# HTTP API, Prometheus text exposition, web dashboard
axum = "0.8.9"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# Native SocketCAN input (Linux only; other platforms use the CAN gateway)
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4.0.0", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
