# ========================================
# ecu-to-mqtt configuration
# ========================================
#
# Every key is optional: with no file at all the gateway finds a Speeduino or
# MegaSquirt on a USB serial port and publishes to an MQTT broker on localhost.
#
# Any key can be overridden with an ECU_TO_MQTT_<KEY> environment variable
# (e.g. ECU_TO_MQTT_MQTT_HOST=broker.local). A .env file in the working
# directory is loaded too. Check the result with:  ecu-to-mqtt --check-config

# ========================================
# Connection
# ========================================

# "serial"    – USB / hardware serial port (default)
# "tcp"       – raw TCP socket: WiFi/Ethernet serial bridge (ESP32, Moxa, USR)
#               or, for a CAN profile, the CAN gateway (scripts/can_gateway.py)
# "can"       – native Linux SocketCAN interface, CAN profiles only
# "simulator" – built-in Speeduino engine model, no hardware needed
connection_type = "serial"

# Serial device ("/dev/ttyACM0", "/dev/ttyUSB0", "COM3") or "auto".
# "auto" probes USB serial adapters with the read-only signature request and
# uses the first one that answers. Built-in UARTs (ttyS*, Raspberry Pi GPIO
# serial) are not probed; name them explicitly. List candidates with:
#   ecu-to-mqtt --list-ports      (ranked)
#   ecu-to-mqtt --probe           (asks each one for its signature)
# Opening a port may reset an Arduino-based board; the gateway waits 2 s.
port_name = "auto"

# Most Speeduino and MegaSquirt setups use 115200.
baud_rate = 115200

# tcp_host = "192.168.1.100"
# tcp_port = 23              # CAN gateway (scripts/can_gateway.py): 29536

# SocketCAN interface. Bring it up with the ECU's bitrate first:
#   sudo ip link set can0 up type can bitrate 500000
# can_interface = "can0"

# ========================================
# ECU protocol
# ========================================

# "auto" (default) – identify a serial ECU from its signature
# Serial: speeduino, ms2, ms3, ms3_pro, microsquirt
# CAN:    megasquirt_can_dash, megasquirt_can_realtime, haltech_can_v2,
#         maxxecu_can_v12, maxxecu_can_v13, ecumaster_emu_can, aemnet_can,
#         link_generic_dash, link_generic_dash2, motec_m1_pdm
# CAN profiles cannot be detected; set one explicitly. See ECU_PROTOCOLS.md
# and examples/ for one ready-made config per profile.
ecu_protocol = "auto"

# CAN base identifier override (TOML accepts hex; the env override is decimal).
# can_base_id = 0x360

# Speeduino realtime packet length the first poll asks for (119–256). The
# gateway learns the real length from the first reply, so this rarely matters.
# Firmware 2025.01 sends 130 bytes.
# expected_data_length = 130

# Poll interval in milliseconds. 20 ms = 50 Hz, which a USB Speeduino sustains.
refresh_rate_ms = 20

# Reply timeout per poll (ms).
# read_timeout_ms = 2000

# Consecutive failed polls before the link is reopened.
# max_retry_count = 10

# Reconnect backoff (ms): doubles from the initial delay up to the maximum.
# initial_retry_delay_ms = 1000
# max_retry_delay_ms = 60000

# ========================================
# MQTT
# ========================================

# false = no broker; live data in the terminal and the web dashboard only.
mqtt_enabled = true
mqtt_host = "localhost"
mqtt_port = 1883

# G86 car slug (lower-case letters, digits, hyphens; up to 32). With `car` set
# and no mqtt_base_topic, the base topic is /g86/<car>/ecu (G86 car computer).
# car = "golf86"

# Topic prefix; set it explicitly to keep a custom layout (it wins over `car`).
# Neither set: the legacy default "/ECU/", so existing installs keep working.
# <base>/status is "online"/"offline" (retained, last will).
# <base>/health is the bridge health JSON (retained, every 5 s and on change).
mqtt_base_topic = "/ECU/"

# What to publish (list, or a comma-separated string in the env override):
#   canonical      <base>/telemetry  JSON envelope per sample, never retained
#                  (the G86 app contract, see README)
#   legacy         <base>/RPM, <base>/CLT … Speeduino scalars, on change + every 1 s
#   json           <base>/state      full retained JSON document
#   homeassistant  Home Assistant MQTT discovery for the main channels
mqtt_formats = ["canonical", "legacy"]

# Rate cap for legacy and json topics (Hz); 0 = every sample.
# The canonical envelope is never throttled.
# mqtt_max_rate_hz = 10

# mqtt_homeassistant_prefix = "homeassistant"

# 0 = at most once (default), 1 = at least once, 2 = exactly once
# mqtt_qos = 0

# Default: ecu-to-mqtt-<pid>
# mqtt_client_id = "ecu-to-mqtt-car-1"

# Requests queued while the broker is unreachable.
# message_buffer_size = 1000

# mqtt_username = "car-1"
# mqtt_password = "secret"
# mqtt_password_file = "/run/secrets/mqtt_password"   # wins over mqtt_password

# TLS (port 8883). Without a CA path the built-in root store is used; client
# certificates need a CA path.
# mqtt_use_tls = false
# mqtt_ca_cert_path = "/etc/ecu-to-mqtt/ca.crt"
# mqtt_client_cert_path = "/etc/ecu-to-mqtt/client.crt"
# mqtt_client_key_path = "/etc/ecu-to-mqtt/client.key"

# ========================================
# HTTP API and web dashboard
# ========================================

# Serves /health, /metrics (Prometheus), /api/v1/* (REST + SSE) and the
# dashboard at /.
# http_enabled = false
# http_bind = "127.0.0.1"    # "0.0.0.0" to reach it from other devices
# http_port = 9091

# Bearer token for /api/*; the dashboard asks for it once and keeps it in the
# browser. /health and /metrics stay open.
# Set one whenever http_bind is not loopback.
# http_token = "change-me"

# Access-Control-Allow-Origin for a dashboard served from another origin.
# http_cors_origin = "https://dash.example.com"

# Set false to serve only the API.
# http_ui = true

# ========================================
# Logging and capture
# ========================================

# trace | debug | info | warn | error
log_level = "info"

# JSON log lines (Loki, ELK).
# log_json = false

# Local canonical NDJSON archive (absolute path), written in synced batches.
# Rotate or export it before it reaches the 512 MiB cap.
# telemetry_log = "/var/lib/ecu-to-mqtt/telemetry.ndjson"
